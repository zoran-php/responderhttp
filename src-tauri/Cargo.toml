[package]
name = "responderhttp"
version = "1.1.0"
description = "API client — single binary, libcurl statically linked, no system dependencies"
edition = "2021"

[lib]
name = "responderhttp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"

# Native Save As dialog for "Send and download". Tauri 2 has no dialog in
# core, and a file chooser needs platform APIs — this is the first-party
# plugin and it links into the binary, so the single-file guarantee holds
# (CLAUDE.md section 11, rule 2). Rust side only: the chooser is exposed
# through our own command rather than @tauri-apps/plugin-dialog, so the call
# stays behind a typed service function (rule 3).
tauri-plugin-dialog = "2"

# Logging. Mirrors the setup in the Lockoncam desktop app so the two Tauri
# codebases stay recognisable to the same maintainer: tauri-plugin-log owns
# the rolling file target, `log` is the facade the rest of the crate calls,
# chrono formats the timestamp.
tauri-plugin-log = "2"
log = "0.4"
chrono = "0.4"

# SQLite driven from Rust repositories, not from the frontend: tauri-plugin-sql
# exposes SQL to JS, which CLAUDE.md section 11 rules 3 and 4 forbid. "bundled"
# compiles SQLite into the binary, keeping the single-file guarantee.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# libcurl statically linked — never dynamic, never a system curl binary.
# rustls avoids a system OpenSSL dependency; if a platform forces OpenSSL,
# switch to "static-ssl", never dynamic linking. See CLAUDE.md §4 and §11.
curl = { version = "0.4", default-features = false, features = [
  "static-curl",
  "rustls",
  "http2",
] }

# Secrets at rest (PLAN.md Phase 9): one data key in the OS credential store,
# every secret sealed with AES-256-GCM in SQLite.
#
# aws-lc-rs is already linked: rustls, which libcurl's TLS goes through, is
# built on it (see Cargo.lock), so depending on it directly adds no new crypto
# code to the binary. Only the AEAD and RNG are used, never hand-rolled.
aws-lc-rs = { version = "1.18", default-features = false, features = [
  "aws-lc-sys",
] }
# zeroize (wipes key material on drop) is already linked through rustls.
# base64 carries sealed bytes inside the JSON columns; the same version was
# already compiled for Tauri's build-time code generation, so in the shipped
# binary it is a small pure-Rust addition with no system dependency.
base64 = "0.22"
zeroize = "1"

# YAML for OpenAPI: written by the export (PLAN.md Phase 8e), read by the
# import (Phase 8d). Chosen over the serde_yaml forks because it is
# maintained, pure Rust and forbids `unsafe` (serde_yml is RUSTSEC-2025-0068;
# serde_norway wraps a C-to-Rust translation of libyaml). The `include` and
# `properties` features stay off: an imported file must not be able to pull
# in other files or environment values. Cargo.lock pins it: take upgrades
# deliberately.
serde-saphyr = { version = "1", default-features = false, features = [
  "serialize",
  "deserialize",
] }

# JSON Schema validation for the OpenAPI import (PLAN.md Phase 8d), against
# the official OAI schemas vendored in schemas/openapi. Chosen over
# `jsonschema`, which could not resolve the 3.1/3.2 schema-base files and
# fetches over HTTP by default. Its loader is replaced so nothing outside the
# vendored set can ever be read.
boon = "0.6"

# gRPC schemas at runtime (PLAN-GRPC.md 16b, decision D2). A gRPC request's
# `.proto` files are only known once the user imports them or the server
# answers reflection, so nothing can be generated at build time:
# - protox compiles `.proto` sources in memory. It is a protobuf compiler in
#   Rust, so the user never needs `protoc`, and it carries the well-known
#   google/protobuf files itself.
# - prost-reflect describes the compiled messages and converts them between
#   the editor's JSON and protobuf bytes ("serde" is the JSON mapping).
# - prost is the encoding they both sit on, and derives the five reflection
#   protocol messages (proto/reflection.rs).
# All three are pure Rust, Apache-2.0 OR MIT, with no system dependency.
protox = "0.9"
prost-reflect = { version = "0.16", features = ["serde"] }
prost = "0.14"
# Named only to read where a schema error is: protox reports the position
# as a miette label (a byte offset), and proto/compile.rs turns it into
# `file:line:column`. Already in the binary through protox, at the same
# major version, so this line adds no code. Default features off: nothing
# here renders miette's own reports.
miette = { version = "7", default-features = false }

# The credential store itself. keyring-core plus one explicit store, rather
# than the `keyring` umbrella crate: a store chosen by feature flag is how a
# build ends up on the mock store without anyone noticing. This block is
# Windows; Linux has oo7 below (PLAN-LINUX.md 17c), and macOS is still
# deferred, so secrets there report the store as unavailable. Both
# talk to Credential Manager in advapi32, which is already on the static-link
# allowlist.
[target.'cfg(windows)'.dependencies]
keyring-core = "1"
windows-native-keyring-store = "1"

# The "still running in the tray" toast (PLAN.md Phase 11). From the tauri-apps
# org, the same wrapper tauri-plugin-notification uses underneath, taken
# directly because that plugin exposes no toast buttons on Windows and this
# notice needs two.
tauri-winrt-notification = "0.8"

# The data key's home on Linux (PLAN-LINUX.md 17c, decision D3): Secret
# Service (GNOME Keyring, KWallet) over D-Bus on the host, and inside a
# Flatpak an encrypted keyring file whose key comes from the Secret portal.
# Pure Rust. It reuses the zbus, zvariant and tokio versions already linked
# (zbus through tauri-plugin-single-instance), so there is no second D-Bus
# stack. native_crypto, never openssl_crypto: that would link OpenSSL
# dynamically, which CLAUDE.md section 11 rule 2 forbids.
[target.'cfg(target_os = "linux")'.dependencies]
oo7 = { version = "0.6", default-features = false, features = [
  "tokio",
  "native_crypto",
] }
# Asks the session bus whether a tray host is running before a tray icon is
# made (desktop/tray.rs, PLAN-LINUX.md 17b). Already linked, at this version,
# through tauri-plugin-single-instance and oo7, so it adds no code; named here
# only because the app now calls it directly.
zbus = { version = "5", default-features = false, features = ["blocking-api"] }

# Native message dialog for the one moment there is no app handle: the
# missing-webview check runs before the Tauri builder (desktop/webview.rs),
# and tauri-plugin-dialog's builder needs a Dialog<R> that only an app can
# hand out. rfd is the crate that plugin uses underneath, declared here with
# the same version, the same features and the same kind of target filter, so
# the build unifies on one copy: this line leaves Cargo.lock untouched and
# adds no code to the binary.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
rfd = { version = "0.16", default-features = false, features = [
  "common-controls-v6",
] }

[dev-dependencies]
# Local mock HTTP server for the CurlClient integration tests. Chosen over
# wiremock because its API is synchronous, matching the blocking HttpClient
# trait — no async runtime just to drive a blocking client.
httpmock = "0.7"
# The local gRPC server for tests/grpc.rs (PLAN-GRPC.md 16d, D7 as
# revised): a raw HTTP/2 server rather than a gRPC framework, so it can
# misbehave on purpose and log the headers libcurl sent. Test-only, so none
# of it reaches the release binary. tokio, http and bytes are already in the
# tree through Tauri; h2 is the one new crate.
h2 = "0.4"
http = "1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
